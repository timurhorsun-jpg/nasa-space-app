<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Last Signal — Abandoned but not Forgotten</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;800&family=Newsreader:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
:root{--bg:#1a1838;--bg2:#24214d;--ink:#f3ecdd;--dim:#b4aed0;--amber:#ffb347;--rust:#e0673f;--moon:#cfd3dc;--blue:#7fb4ff;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1.15rem/1.65 Newsreader,Georgia,serif}
h1,h2,h3,button,.meta{font-family:"Bricolage Grotesque",system-ui,sans-serif}
:focus-visible{outline:3px solid var(--amber);outline-offset:3px}
.lang{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:14px;z-index:5;display:flex;gap:4px;background:var(--bg2);padding:4px;border-radius:99px}
.lang button{border:0;background:none;color:var(--dim);padding:6px 12px;border-radius:99px;cursor:pointer;font-weight:500}
.lang button[aria-pressed=true]{background:var(--amber);color:#1a1838}
.rail{position:fixed;left:0;top:0;bottom:0;width:6px;background:var(--bg2);z-index:4}
.rail i{display:block;width:100%;height:0;background:linear-gradient(var(--blue),var(--amber))}
.dist{position:fixed;left:18px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:4;background:var(--bg2);padding:8px 14px;border-radius:10px;font:500 .9rem "Bricolage Grotesque",sans-serif;color:var(--dim)}
.dist b{color:var(--amber);font-weight:800}
section{min-height:100vh;min-height:100svh;padding:12vh 7vw 12vh calc(7vw + 6px);display:flex;flex-direction:column;justify-content:center}
.wrap{max-width:46rem}
.hero h1{font-weight:800;font-size:clamp(2.6rem,9vw,6.4rem);line-height:.98;margin:0 0 1.5rem;letter-spacing:-.03em}
.hero p{max-width:34rem;color:var(--dim)}
.ping{display:inline-block;width:14px;height:14px;border-radius:50%;background:var(--amber);margin-right:10px;box-shadow:0 0 0 0 var(--amber);animation:p 2.4s infinite}
@keyframes p{70%{box-shadow:0 0 0 22px transparent}100%{box-shadow:0 0 0 0 transparent}}
.btn{margin-top:2rem;align-self:flex-start;background:var(--amber);color:#1a1838;border:0;padding:14px 26px;border-radius:12px;font-weight:800;font-size:1.05rem;cursor:pointer}
.stop{border-top:1px solid #ffffff22}
.stop h2{font-size:clamp(2rem,6vw,3.6rem);margin:0;font-weight:800;line-height:1.05;letter-spacing:-.02em;color:var(--c)}
.where{margin:.3rem 0 1.4rem;color:var(--dim);font:500 1rem "Bricolage Grotesque",sans-serif}
.stop blockquote{margin:0 0 1.6rem;font:italic 400 clamp(1.4rem,4vw,2.1rem)/1.3 Newsreader,Georgia,serif}
.facts{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(11rem,1fr));margin:1.6rem 0}
.facts div{border-left:3px solid var(--c);padding-left:12px}
.facts b{display:block;font:800 1.5rem "Bricolage Grotesque",sans-serif;color:var(--c)}
.facts span{font-size:.95rem;color:var(--dim);line-height:1.35;display:block}
.sci{background:var(--bg2);padding:16px 20px;border-radius:12px;font-size:1.02rem}
.sci h3{margin:0 0 4px;font-size:1rem;color:var(--c)}
.quiz{background:var(--bg2)}
.quiz h2{font-weight:800;font-size:clamp(2rem,6vw,3.4rem);margin:0 0 1.5rem}
.q p{font-weight:500;font-family:"Bricolage Grotesque",sans-serif;font-size:1.2rem;margin:0 0 .6rem}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:.6rem}
.opts button{background:#ffffff14;color:var(--ink);border:2px solid transparent;padding:10px 16px;border-radius:10px;cursor:pointer;font-size:1rem}
.opts button:hover:not(:disabled){border-color:var(--amber)}
.opts .ok{background:#2f8f5b;border-color:#2f8f5b}.opts .no{background:#8f3a3a}
.fb{min-height:1.6em;color:var(--dim);font-size:1rem;margin:0 0 1.4rem}
.score{font:800 1.4rem "Bricolage Grotesque",sans-serif;color:var(--amber)}
footer{padding:6vh 7vw 14vh calc(7vw + 6px);color:var(--dim);font-size:.95rem}
#st{position:fixed;inset:0;z-index:-1;width:100%;height:100%}
.hero{position:relative;overflow:hidden}
.earth{position:absolute;right:-8vmin;bottom:-14vmin;width:52vmin;height:52vmin;border-radius:50%;background:radial-gradient(circle at 32% 30%,#8fd0ff,#2e6fcf 45%,#16336f 80%);box-shadow:0 0 90px 10px #4a86d655}
.earth::after{content:"";position:absolute;inset:18% 12% 40% 30%;border-radius:50% 40% 60% 50%;background:#5fae7a;opacity:.8}
.art{position:relative;margin:0 0 1.8rem;border-radius:16px;overflow:hidden;aspect-ratio:5/2;background:#0d0c24;border:1px solid #ffffff22}
.art svg,.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.art.ph{aspect-ratio:auto;background:none;width:fit-content;max-width:100%}
.art.ph svg{display:none}
.art.ph img{position:static;display:block;width:auto;max-width:100%;height:auto;max-height:60vh}
.stop .wrap{max-width:84rem;display:grid;grid-template-columns:minmax(0,42rem) minmax(0,32rem);column-gap:3.5rem;align-items:start}
.stop .wrap>*{grid-column:1}
.stop .wrap>.art{grid-column:2;grid-row:1/span 5;margin:0}
@media(max-width:900px){.stop .wrap{display:block;max-width:46rem}.stop .wrap>.art{margin:0 0 1.8rem}}
.hbg{position:absolute;top:0;right:0;width:min(100%,72vw,1300px);z-index:0;pointer-events:none;-webkit-mask-image:linear-gradient(90deg,transparent,#000 38%),linear-gradient(#000 52%,transparent 100%);-webkit-mask-composite:source-in;mask-image:linear-gradient(90deg,transparent,#000 38%),linear-gradient(#000 52%,transparent 100%);mask-composite:intersect}
.hbg img{display:block;width:100%;height:auto;transform:scaleY(-1)}
.hero{justify-content:flex-end;padding-bottom:12vh}
.hero>.wrap,.hero>.btn{position:relative;z-index:1}
#sh{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.shoot{position:absolute;width:180px;height:1.5px;border-radius:2px;background:linear-gradient(90deg,transparent,#ffffff33 55%,#fff);box-shadow:0 0 5px #ffffff55;opacity:0;animation:sh 1.6s linear forwards}
@keyframes sh{0%{opacity:0;transform:translate(0,0) rotate(var(--a))}6%{opacity:.85}88%{opacity:.85}100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(var(--a))}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.ping{animation:none}}
</style>
</head>
<body>

<div id="sh" aria-hidden="true"></div>

<div class="lang" role="group" aria-label="Language"><button data-l="uk" aria-pressed="true">UA</button><button data-l="en" aria-pressed="false">EN</button></div>
<div class="dist" aria-live="off"><span id="dl"></span> <b id="dv">0 km</b></div>

let L="uk",score=0,done=0;
const $=s=>document.querySelector(s),fmt=n=>n.toLocaleString(L==="uk"?"uk-UA":"en-US");
function render(){
 const t=T[L],e=T.en;score=0;done=0;document.documentElement.lang=L;
 $("#app").innerHTML=`<section class="hero" data-n="0"><div class="hbg" aria-hidden="true"><img src="${IMG.earth}" alt=""></div><div class="wrap"><h1>${t.t}</h1><p><span class="ping"></span>${t.sub}</p></div><button class="btn" id="go">${t.go}</button></section>`+
 e.stops.map((s,i)=>{const r=t.stops[i];return `<section class="stop" data-n="${s.n}" style="--c:${s.c}"><div class="wrap"><figure class="art">${ART[s.id]}<img src="${IMG[s.id]||'img/'+s.id+'.jpg'}" alt="" onload="this.parentNode.classList.add('ph')" onerror="this.remove()"></figure><h2>${r.a}</h2><p class="where">${r.h}</p><blockquote>${r.q}</blockquote><div class="facts">${r.f.map(f=>`<div><b>${f[0]}</b><span>${f[1]}</span></div>`).join("")}</div><div class="sci"><h3>${t.sci}</h3>${r.s}</div></div></section>`}).join("")+
 `<section class="quiz" data-n="24000000000"><div class="wrap"><h2>${t.quizT}</h2>${t.quiz.map((q,i)=>`<div class="q"><p>${q.q}</p><div class="opts">${q.o.map((o,j)=>`<button data-i="${i}" data-j="${j}">${o}</button>`).join("")}</div><p class="fb" id="fb${i}"></p></div>`).join("")}<div class="score" id="sc"></div></div></section><footer>${t.foot}</footer>`;
 $("#dl").textContent=t.from;
 $("#go").onclick=()=>document.querySelector(".stop").scrollIntoView({behavior:"smooth"});
 document.querySelectorAll(".opts button").forEach(b=>b.onclick=()=>{
  const i=+b.dataset.i,j=+b.dataset.j,ok=j===e.quiz[i].a;
  b.parentNode.querySelectorAll("button").forEach(x=>x.disabled=true);
  b.classList.add(ok?"ok":"no");if(!ok)b.parentNode.children[e.quiz[i].a].classList.add("ok");
  $("#fb"+i).textContent=(ok?t.right:t.wrong)+t.quiz[i].e;
  if(ok)score++;done++;$("#sc").textContent=done===3?t.score+score+"/3":"";});
 upd();
}
function upd(){
 const h=document.documentElement,p=scrollY/Math.max(1,h.scrollHeight-innerHeight);
 $("#bar").style.height=(p*100)+"%";
 let cur=0;document.querySelectorAll("section").forEach(s=>{if(s.getBoundingClientRect().top<innerHeight*.5)cur=+s.dataset.n});
 $("#dv").textContent=fmt(cur)+" "+(L==="uk"?"км":"km");
}
addEventListener("scroll",upd,{passive:true});
document.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>{L=b.dataset.l;document.querySelectorAll(".lang button").forEach(x=>x.setAttribute("aria-pressed",x===b));render()});
const cv=$("#st"),cx=cv.getContext("2d");
function stars(){cv.width=innerWidth;cv.height=innerHeight;for(let i=0;i<150;i++){cx.fillStyle="rgba(243,236,221,"+(.2+Math.random()*.7)+")";cx.fillRect(Math.random()*cv.width,Math.random()*cv.height,Math.random()*1.8+.4,Math.random()*1.8+.4)}}
stars();addEventListener("resize",stars);
const PATHS=[[90,5,145,700],[70,0,150,600],[100,25,160,800],[50,10,125,500],[10,5,35,700],[30,15,25,800],[0,40,20,900],[60,0,95,500],[85,35,175,700],[20,0,60,550],[95,50,150,500],[5,70,-20,700]];
function shoot(){const p=PATHS[Math.random()*PATHS.length|0],r=p[2]*Math.PI/180,c=Math.cos(r),sn=Math.sin(r),w=110+Math.random()*130,lx=p[0]+Math.random()*6,ty=p[1]+Math.random()*6,x0=lx*innerWidth/100,y0=ty*innerHeight/100,a=c>.001?(innerWidth-x0)/c:c<-.001?-x0/c:1e9,b=sn>.001?(innerHeight-y0)/sn:sn<-.001?-y0/sn:1e9,d=Math.min(a,b)+w+40,e=document.createElement("i");e.className="shoot";e.style.cssText="width:"+w+"px;left:"+lx+"vw;top:"+ty+"vh;animation-duration:"+(d/480)+"s";e.style.setProperty("--a",p[2]+"deg");e.style.setProperty("--dx",c*d+"px");e.style.setProperty("--dy",sn*d+"px");$("#sh").appendChild(e);setTimeout(()=>e.remove(),d/480*1000+200)}
(function loop(){shoot();setTimeout(loop,1000+Math.random()*2000)})();
render();
</script>
